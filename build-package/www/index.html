<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e3c72">
    <title>Object Finder - Localizador de Objetos</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>OBJECT FINDER</h1>
            <div class="settings-icon" id="settingsIcon">⚙️</div>
        </header>

        <!-- Main Display -->
        <div class="main-display">
            <!-- Signal Strength Bars -->
            <div class="signal-bars">
                <div class="bar" data-level="1"></div>
                <div class="bar" data-level="2"></div>
                <div class="bar" data-level="3"></div>
                <div class="bar" data-level="4"></div>
                <div class="bar" data-level="5"></div>
            </div>

            <!-- Radar Display -->
            <div class="radar-container">
                <div class="radar">
                    <div class="radar-line"></div>
                    <div class="radar-dot"></div>
                </div>
                <div class="signal-text">
                    <span id="signalStrength">0</span>%
                </div>
            </div>

            <!-- Status Display -->
            <div class="status-display">
                <div class="status-text" id="statusText">APAGADO</div>
                <div class="angle-display" id="angleDisplay">0°</div>
            </div>
        </div>

        <!-- Power Button -->
        <div class="power-button-container">
            <button class="power-button" id="powerButton">
                <span class="power-icon">⏻</span>
                <span class="power-text">ENCENDER</span>
            </button>
        </div>

        <!-- Hidden Settings Menu -->
        <div class="settings-menu hidden" id="settingsMenu">
            <div class="settings-content">
                <h2>Configuración</h2>
                <button class="close-settings" id="closeSettings">✕</button>

                <div class="setting-item">
                    <label for="targetAngle">Ángulo objetivo (grados):</label>
                    <input type="number" id="targetAngle" min="0" max="360" value="90">
                    <input type="range" id="targetAngleSlider" min="0" max="360" value="90">
                    <span class="range-value" id="angleValue">90°</span>
                </div>

                <div class="setting-item">
                    <label for="tolerance">Tolerancia (±grados):</label>
                    <input type="number" id="tolerance" min="1" max="45" value="10">
                    <input type="range" id="toleranceSlider" min="1" max="45" value="10">
                    <span class="range-value" id="toleranceValue">±10°</span>
                </div>

                <div class="setting-item">
                    <label for="sensitivity">Sensibilidad:</label>
                    <select id="sensitivity">
                        <option value="low">Baja</option>
                        <option value="medium" selected>Media</option>
                        <option value="high">Alta</option>
                    </select>
                </div>

                <button class="save-button" id="saveSettings">Guardar</button>
            </div>
        </div>

        <!-- Permission Request Overlay -->
        <div class="permission-overlay hidden" id="permissionOverlay">
            <div class="permission-content">
                <h2>Permiso Requerido</h2>
                <p>Esta aplicación necesita acceso al sensor de orientación de tu dispositivo.</p>
                <button class="permission-button" id="requestPermission">Permitir Acceso</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('Service Worker registered successfully:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
