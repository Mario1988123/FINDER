<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e3c72">
    <title>Object Finder - Localizador de Objetos</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <img src="icon-512.png" alt="Object Finder" class="splash-icon">
        <h1 class="splash-title">OBJECT FINDER</h1>
        <p class="splash-credit">Creado por EliteMagic®</p>
    </div>

    <div class="container">
        <!-- Header -->
        <header>
            <h1 id="appTitle" style="cursor: pointer;">OBJECT FINDER</h1>
        </header>

        <!-- Main Display -->
        <div class="main-display">
            <!-- Signal Strength Bars -->
            <div class="signal-bars">
                <div class="bar" data-level="1"></div>
                <div class="bar" data-level="2"></div>
                <div class="bar" data-level="3"></div>
                <div class="bar" data-level="4"></div>
                <div class="bar" data-level="5"></div>
            </div>

            <!-- Radar Display -->
            <div class="radar-container">
                <div class="radar">
                    <div class="radar-line"></div>
                    <div class="radar-dot"></div>
                </div>
                <div class="signal-text">
                    <span id="signalStrength">0</span>%
                </div>
            </div>

            <!-- Status Display -->
            <div class="status-display">
                <div class="status-text" id="statusText">APAGADO</div>
                <div class="wrong-mark" id="wrongMark">✕</div>
            </div>
        </div>

        <!-- Power Button -->
        <div class="power-button-container">
            <button class="power-button" id="powerButton">
                <svg class="power-icon" viewBox="0 0 24 24" width="48" height="48">
                    <path fill="currentColor" d="M13,3H11V13H13V3M17.83,5.17L16.41,6.59C18.05,7.91 19,9.9 19,12C19,15.87 15.87,19 12,19C8.13,19 5,15.87 5,12C5,9.9 5.95,7.91 7.59,6.59L6.17,5.17C4.23,6.82 3,9.26 3,12C3,16.97 7.03,21 12,21C16.97,21 21,16.97 21,12C21,9.26 19.77,6.82 17.83,5.17Z"/>
                </svg>
                <span class="power-text" id="powerButtonText">ENCENDER</span>
            </button>
        </div>

        <!-- Corner buttons for Anytime mode (hidden by default) -->
        <div class="corner-button corner-top-left hidden" id="cornerTopLeft"></div>
        <div class="corner-button corner-top-right hidden" id="cornerTopRight"></div>
        <div class="corner-button corner-bottom-left hidden" id="cornerBottomLeft"></div>
        <div class="corner-button corner-bottom-right hidden" id="cornerBottomRight"></div>

        <!-- Hidden Settings Menu -->
        <div class="settings-menu hidden" id="settingsMenu">
            <div class="settings-content">
                <h2>Configuración</h2>
                <button class="close-settings" id="closeSettings">✕</button>

                <div class="setting-item">
                    <label for="detectionMode">Modo de Detección:</label>
                    <select id="detectionMode">
                        <option value="rotation">Rotación 360° (Girar teléfono)</option>
                        <option value="anywhere">Anywhere (Marcar posición inicial)</option>
                        <option value="linear-horizontal">Lineal (Tocar botón)</option>
                        <option value="anytime">Anytime (Múltiples intentos)</option>
                    </select>
                </div>

                <div class="setting-item rotation-mode">
                    <label for="numPositions">Número de posiciones:</label>
                    <select id="numPositions">
                        <option value="1">1 posición</option>
                        <option value="2">2 posiciones</option>
                        <option value="3">3 posiciones</option>
                        <option value="4">4 posiciones</option>
                        <option value="5">5 posiciones</option>
                        <option value="6">6 posiciones</option>
                        <option value="8">8 posiciones</option>
                        <option value="12">12 posiciones</option>
                    </select>
                </div>

                <div class="setting-item rotation-mode" id="anglesContainer">
                    <!-- Campos de ángulos se generarán dinámicamente aquí -->
                </div>

                <div class="setting-item linear-mode hidden">
                    <label for="numObjects">Número de objetos:</label>
                    <select id="numObjects">
                        <option value="2">2 objetos</option>
                        <option value="3">3 objetos</option>
                        <option value="4">4 objetos</option>
                        <option value="5">5 objetos</option>
                        <option value="6">6 objetos</option>
                        <option value="7">7 objetos</option>
                        <option value="8">8 objetos</option>
                        <option value="9">9 objetos</option>
                        <option value="10">10 objetos</option>
                    </select>
                </div>

                <div class="setting-item linear-mode hidden">
                    <label for="targetObjectIndex">Objeto objetivo (posición):</label>
                    <select id="targetObjectIndex">
                        <!-- Se llenará dinámicamente -->
                    </select>
                    <p class="hint">Posición del objeto que será el correcto</p>
                </div>

                <div class="setting-item linear-mode hidden" id="objectsContainer">
                    <!-- Campos de objetos se generarán dinámicamente aquí -->
                </div>

                <div class="setting-item">
                    <label for="tolerance">Tolerancia:</label>
                    <input type="number" id="tolerance" min="1" max="45" value="10">
                    <input type="range" id="toleranceSlider" min="1" max="45" value="10">
                    <span class="range-value" id="toleranceValue">±10°</span>
                </div>

                <div class="setting-item">
                    <label for="sensitivity">Sensibilidad:</label>
                    <select id="sensitivity">
                        <option value="low">Baja</option>
                        <option value="medium" selected>Media</option>
                        <option value="high">Alta</option>
                    </select>
                </div>

                <button class="save-button" id="saveSettings">Guardar</button>
            </div>
        </div>

        <!-- Permission Request Overlay -->
        <div class="permission-overlay hidden" id="permissionOverlay">
            <div class="permission-content">
                <h2>Permiso Requerido</h2>
                <p>Esta aplicación necesita acceso al sensor de orientación de tu dispositivo.</p>
                <button class="permission-button" id="requestPermission">Permitir Acceso</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('Service Worker registered successfully:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
