name: Build Android APK

on:
  push:
    branches: [ claude/gyroscope-object-finder-* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova project
      run: |
        cordova create object-finder com.objectfinder.app "Object Finder"
        cd object-finder

        # Copy web files
        cp -f ../index.html www/
        cp -f ../style.css www/
        cp -f ../app.js www/
        cp -f ../manifest.json www/ || true
        cp -f ../icon-*.png www/ || true

    - name: Add Android platform
      run: |
        cd object-finder
        cordova platform add android@latest

    - name: Configure Android permissions
      run: |
        cd object-finder
        cat > config.xml << 'EOF'
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.objectfinder.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Object Finder</name>
            <description>Aplicación localizadora de objetos con giroscopio</description>
            <author email="dev@cordova.apache.org" href="https://cordova.apache.org">
                Object Finder Team
            </author>
            <content src="index.html" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />

            <preference name="orientation" value="portrait" />
            <preference name="fullscreen" value="false" />
            <preference name="DisallowOverscroll" value="true" />
            <preference name="BackgroundColor" value="0xff1e3c72" />

            <platform name="android">
                <preference name="android-minSdkVersion" value="24" />
                <preference name="android-targetSdkVersion" value="34" />

                <config-file target="AndroidManifest.xml" parent="/*">
                    <uses-permission android:name="android.permission.VIBRATE" />
                    <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="false" />
                    <uses-feature android:name="android.hardware.sensor.accelerometer" android:required="false" />
                </config-file>
            </platform>

            <access origin="*" />
        </widget>
        EOF

    - name: Build APK
      run: |
        cd object-finder
        cordova build android --release --verbose

    - name: Find and rename APK
      run: |
        cd object-finder
        find platforms/android/app/build/outputs -name "*.apk" -type f
        cp platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk ../object-finder.apk || \
        cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../object-finder.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: object-finder-apk
        path: object-finder.apk
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/claude/gyroscope-object-finder-01ELkdGbedws5zpa34VPJ9FT'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0-${{ github.run_number }}
        name: Object Finder v1.0.0 Build ${{ github.run_number }}
        body: |
          ## 🎯 Object Finder APK

          Aplicación localizadora de objetos con giroscopio.

          ### 📱 Instalación:
          1. Descarga el APK
          2. Habilita "Instalar apps desconocidas" en tu móvil
          3. Abre el APK y confirma la instalación

          ### ✨ Características:
          - Detección por giroscopio
          - Señal visual con barras y radar
          - Pitidos de proximidad
          - Configuración personalizable
        files: object-finder.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
