name: Build APK

on:
  push:
    branches: [ claude/* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        sdkmanager --list_installed
        echo "✓ Android SDK components installed"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova@12

    - name: Setup Gradle 8.x
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        sudo mv gradle-8.5 /opt/gradle
        sudo ln -sf /opt/gradle/bin/gradle /usr/bin/gradle
        gradle --version
        echo "✓ Gradle 8.5 installed"

    - name: Create Cordova project
      run: |
        cordova create build-cordova com.objectfinder.app "Object Finder"

    - name: Copy web files
      run: |
        cp -f index.html build-cordova/www/
        cp -f style.css build-cordova/www/
        cp -f app.js build-cordova/www/
        echo "✓ Web files copied"

    - name: Create config.xml
      run: |
        cat > build-cordova/config.xml << 'EOF'
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.objectfinder.app" version="2.1.1" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Object Finder</name>
            <description>Aplicación localizadora de objetos con giroscopio</description>
            <author email="support@objectfinder.app">Object Finder Team</author>
            <content src="index.html" />
            <preference name="orientation" value="portrait" />
            <preference name="Fullscreen" value="true" />
            <preference name="DisallowOverscroll" value="true" />
            <preference name="BackgroundColor" value="#1e3c72" />
            <platform name="android">
                <preference name="android-minSdkVersion" value="24" />
                <preference name="android-targetSdkVersion" value="33" />
            </platform>
            <access origin="*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
        </widget>
        EOF
        echo "✓ Config.xml created"

    - name: Add Android platform
      run: |
        cd build-cordova
        cordova platform add android@12
        echo "✓ Android platform added"

    - name: Add Cordova plugins
      run: |
        cd build-cordova
        cordova plugin add cordova-plugin-statusbar
        cordova plugin add cordova-plugin-fullscreen
        echo "✓ Plugins installed"

    - name: Build APK with Cordova
      run: |
        cd build-cordova
        export GRADLE_HOME=/opt/gradle
        export PATH=$GRADLE_HOME/bin:$PATH
        cordova build android --debug --verbose
        echo "✓ APK built successfully"

    - name: List APK files
      run: |
        echo "Looking for APK files..."
        find build-cordova/platforms/android/app/build/outputs -name "*.apk"

    - name: Copy APK to artifacts
      run: |
        mkdir -p apk-output
        cp build-cordova/platforms/android/app/build/outputs/apk/debug/app-debug.apk apk-output/object-finder.apk
        ls -lh apk-output/
        echo "✓ APK ready for upload"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: object-finder-apk
        path: apk-output/object-finder.apk
        retention-days: 90

    - name: Build Summary
      run: |
        echo "✅ APK compilado exitosamente!"
        echo "📦 Archivo: object-finder.apk"
        echo "📥 Descarga desde: GitHub Actions → Artifacts → object-finder-apk"
        ls -lh apk-output/object-finder.apk
