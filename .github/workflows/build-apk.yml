name: Build Android APK

on:
  push:
    branches: [ claude/gyroscope-object-finder-* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Install Cordova
      run: npm install -g cordova@12

    - name: Create Cordova project and copy files
      run: |
        cordova create object-finder com.objectfinder.app "Object Finder"

        # Copy web files
        cp -f index.html object-finder/www/
        cp -f style.css object-finder/www/
        cp -f app.js object-finder/www/

        echo "Files copied successfully"
        ls -la object-finder/www/

    - name: Configure config.xml
      run: |
        cat > object-finder/config.xml << 'EOF'
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.objectfinder.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Object Finder</name>
            <description>Aplicación localizadora de objetos con giroscopio</description>
            <author email="support@objectfinder.app">Object Finder Team</author>
            <content src="index.html" />

            <preference name="orientation" value="portrait" />
            <preference name="BackgroundColor" value="0xff1e3c72" />

            <platform name="android">
                <preference name="android-minSdkVersion" value="24" />
                <preference name="android-targetSdkVersion" value="33" />

                <config-file target="AndroidManifest.xml" parent="/*">
                    <uses-permission android:name="android.permission.VIBRATE" />
                    <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="false" />
                    <uses-feature android:name="android.hardware.sensor.accelerometer" android:required="false" />
                </config-file>
            </platform>

            <access origin="*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
        </widget>
        EOF

        echo "Config.xml created"
        cat object-finder/config.xml

    - name: Add Android platform
      run: |
        cd object-finder
        cordova platform add android@12
        echo "Android platform added"

    - name: Build APK (Debug)
      run: |
        cd object-finder
        cordova build android --debug
        echo "Build completed"

    - name: List generated APKs
      run: |
        echo "Looking for APKs..."
        find object-finder/platforms/android/app/build/outputs -name "*.apk" -type f

    - name: Copy APK
      run: |
        mkdir -p apk-output
        cp object-finder/platforms/android/app/build/outputs/apk/debug/app-debug.apk apk-output/object-finder.apk
        ls -lh apk-output/

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: object-finder-apk
        path: apk-output/object-finder.apk
        retention-days: 90

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ steps.date.outputs.date }}
        name: Object Finder APK - Build ${{ steps.date.outputs.date }}
        body: |
          ## 🎯 Object Finder - Localizador de Objetos con Giroscopio

          **Build:** ${{ steps.date.outputs.date }}
          **Commit:** ${{ github.sha }}

          ### 📱 Instalación:
          1. Descarga el archivo **object-finder.apk**
          2. En tu móvil Android, habilita **"Instalar apps desconocidas"**:
             - Ajustes → Seguridad → Orígenes desconocidos
          3. Abre el APK descargado
          4. Confirma la instalación
          5. ¡Disfruta de tu Object Finder!

          ### ✨ Características:
          - 📍 Detección por giroscopio
          - 📊 Señal visual con barras y radar animado
          - 🔊 Pitidos de proximidad
          - ⚙️ Configuración personalizable
          - 🎨 Interfaz moderna con efectos de neón

          ### 🎮 Cómo usar:
          1. Presiona el botón de encendido
          2. Gira el dispositivo lentamente
          3. La señal aumentará al acercarte al ángulo objetivo
          4. ¡Escucha el pitido cuando lo encuentres!

          ### ⚙️ Configuración:
          - Toca el ícono ⚙️ para ajustar:
            - Ángulo objetivo (0-360°)
            - Tolerancia (±1-45°)
            - Sensibilidad (Baja/Media/Alta)
        files: apk-output/object-finder.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
